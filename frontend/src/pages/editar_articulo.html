<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Artículo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <script src="../js/editar.js"></script>
    <script src="../app.js"></script>
</head>
<body class="section">
    <nav id="nav" class="navbar" role="navigation" aria-label="main navigation">
        
    </nav>
    <div class="container">
        <h1 class="title">Editar Artículo</h1>
        <form id="form_editar">
            <div class="field">
                <label class="label">Título</label>
                <div class="control">
                    <input name="titulo" class="input" type="text" id="titulo" required>
                </div>
            </div>
            <div class="field">
                <label class="label">Precio</label>
                <div class="control">
                    <input name="precio" class="input" type="number" id="precio" required>
                </div>
            </div>
            <div class="field has-addons">
                    <div class="control">
                        <label class="label">Stock</label>
                        <input name="stock" class="input" type="number" placeholder="" min="1" max="99" >
                    </div>
                </div>
                <div class="field">
                    <label class="label">Envio Gratis</label>
                    <div class="control">
                        <div class="select">
                            <select id="envio" name="envio">
                                <option>Si</option>
                                <option>No</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="field">
                    <label class="label">Ubicacion</label>
                    <div class="control">
                        <input name="ubicacion" class="input" type="text" placeholder="">
                    </div>
                </div>
                <div class="field">
                    <label class="label">Descripcion</label>
                    <div class="control">
                        <textarea name="descripcion" class="textarea" maxlength="500" placeholder="Describe las caracteristicas principales de tu producto &#129299;"></textarea>
                    </div>
                </div>
            <div class="control">
                <button class="button is-primary" type="submit">Guardar Cambios</button>
            </div>
        </form>
    </div>
</body>
<script>
    estado_user()
</script>
</html>
