<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <script src="../app.js" ></script>
    <script src="../js/editar_perfil.js" ></script>
    <title>Perfil - KeyStroke</title>
</head>
<body>
    <nav id="nav" class="navbar" role="navigation" aria-label="main navigation">
            
    </nav>
    <section class="section">
        <div class="container">
            <h1 class="title has-text-centered">Editar Perfil</h1>
            <div class="columns is-centered">
                <div class="column is-5">
                    <form id="form_editar_perfil" >
                        <div class="field">
                            <label class="label">Correo electrónico</label>
                            <div class="control">
                            <input class="input" type="email" name="mail" required>
                            </div>
                        </div>
                        <div class="field">
                            <label class="label">Usuario</label>
                            <div class="control">
                            <input class="input" type="text" name="nombre_usuario" required>
                            </div>
                        </div>
                        <div class="field">
                            <label class="label">Contraseña</label>
                            <div class="control">
                            <input class="input" type="password" name="contraseña" required>
                            </div>
                        </div>
                        <div class="field has-text-centered mt-5">
                            <button id="button_save_changes" class="button is-primary" type="submit" >Guardar Cambios</button>
                        </div>                        
                    </form>
                    <div class="field has-text-centered mt-5">
                            <dialog id="windows_delete_user">
                                <p>Seguro que quiere eliminar su perfil, se borrara todos sus articulos publicados.</p>
                                <button id="button_delete_user" type="submit" class="button is-danger">Borrar Perfil</button>
                                <button class="button" onclick="document.getElementById('windows_delete_user').close()">Cancelar</button>
                            </dialog>
                            <button class="button is-danger" onclick="document.getElementById('windows_delete_user').showModal()">Borrar Perfil</button>
                        </div>
                </div>
            </div>
        </div>
    </section>
    <script>
        agregar_nav_sin_login_register()
    </script>
</body>
</html>
