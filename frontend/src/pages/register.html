<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <title>Registro - KeyStroke</title>
</head>
<body>
    <section class="section">
        <div class="container">
            <h1 class="title has-text-centered">Registrate</h1>

            <div class="columns is-centered">
                <div class="column is-5">

                    <form method="POST" action="/register">
                        <div class="field">
                            <label class="label">Correo electrónico</label>
                            <div class="control">
                            <input class="input" type="email" name="email" required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Nombre</label>
                            <div class="control">
                            <input class="input" type="text" name="nombre" required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Usuario</label>
                            <div class="control">
                            <input class="input" type="text" name="usuario" required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Contraseña</label>
                            <div class="control">
                            <input class="input" type="password" name="password" required>
                            </div>
                        </div>

                        <div class="field has-text-centered mt-5">
                            <button class="button is-primary">Registrarse</button>
                        </div>

                        <p class="has-text-centered mt-4">
                            ¿Ya tenés cuenta? <a href="/frontend/src/pages/login.html">Ingresá</a>
                        </p>
                    </form>

                </div>
            </div>
        </div>
    </section>
    <script>
        /*  
        document.getElementById('form-register').addEventListener('submit', async function(e) {
            e.preventDefault();
        

        */
    </script>
</body>
</html>
