<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <script src="../app.js" ></script>
    <script src="../js/register.js"></script>
    <title>Registro - KeyStroke</title>
</head>
<body>
    <nav id="nav" class="navbar" role="navigation" aria-label="main navigation">
            
    </nav>
    <section class="section">
        <div class="container">
            <h1 class="title has-text-centered">Registrate</h1>

            <div class="columns is-centered">
                <div class="column is-5">

                    <form>
                        <div class="field">
                            <label class="label">Correo electrónico</label>
                            <div class="control">
                            <input class="input" type="email" name="mail" required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Usuario</label>
                            <div class="control">
                            <input class="input" type="text" name="nombre_usuario" required>
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Contraseña</label>
                            <div class="control">
                            <input class="input" type="password" name="contraseña" required>
                            </div>
                        </div>

                        <div class="field has-text-centered mt-5">
                            <button class="button is-primary">Registrarse</button>
                        </div>

                        <p class="has-text-centered mt-4">
                            ¿Ya tenés cuenta? <a href="localhost:3000/login">Ingresá</a>
                        </p>
                    </form>

                </div>
            </div>
        </div>
    </section>
    <script>
        agregar_nav_sin_login_register()
    </script>
</body>
</html>
