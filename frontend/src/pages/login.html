<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
        <script src="../js/login.js" ></script>

        <script src="../app.js" ></script>
        <title>Iniciar sesión - KeyStroke</title>
    </head>
    <body>
        <nav id="nav" class="navbar" role="navigation" aria-label="main navigation">
            
        </nav>

        <section class="section">
            <div class="container">
                <h1 class="title has-text-centered">Iniciar sesión</h1>

                <div class="columns is-centered">
                    <div class="column is-5">

                        <form method="POST" id="formulario" action="/datos-no-usados-directamente" >
                            <div class="field">
                                <label class="label">Correo electrónico</label>
                                <div class="control">
                                    <input class="input" type="email" name="email" required>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Contraseña</label>
                                <div class="control">
                                    <input class="input" type="password" name="password" required>
                                </div>
                            </div>

                            <div class="field has-text-centered mt-5">
                                <button class="button is-primary" type="submit">Ingresar</button>
                            </div>

                            <p class="has-text-centered mt-4">
                                ¿No tenés cuenta? <a href="/frontend/src/pages/register.html">Registrate</a>
                            </p>

                        </form>

                    </div>
                </div>
            </div>
        </section>
        <script>
            agregar_nav_sin_login_register()

        </script>
    </body>
</html>
